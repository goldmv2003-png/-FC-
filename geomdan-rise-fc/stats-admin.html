<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RISE FC 득점·도움 기록</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f6f6f6;color:#161616;margin:0;padding:24px}main{max-width:760px;margin:auto;background:white;border:1px solid #e5e5e5;border-radius:16px;padding:24px}h1{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:bold}select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:white;font-size:16px}button{background:#111;color:white;margin-top:12px;cursor:pointer}button.gold{background:#c9a646;color:#111}#status{margin-top:14px;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){body{padding:12px}main{padding:16px}.row{grid-template-columns:1fr}}</style></head><body><main><h1>득점 · 도움 기록 입력</h1><p>경기 종료 후 득점과 도움을 각각 기록하세요. 여러 골이면 기록을 반복 입력하면 됩니다.</p><label>경기 선택</label><select id="match"></select><label>선수 선택</label><select id="player"></select><div class="row"><div><label>기록 종류</label><select id="type"><option value="GOAL">득점 (GOAL)</option><option value="ASSIST">도움 (ASSIST)</option></select></div><div><label>득점 시간 (선택)</label><select id="minute"><option value="">미입력</option><option>10</option><option>20</option><option>30</option><option>40</option><option>50</option><option>60</option><option>70</option><option>80</option><option>90</option></select></div></div><button id="save">기록 저장</button><button class="gold" onclick="location.href='admin.html'">관리자 홈으로</button><div id="status"></div></main><script>const URL='https://gqsecxgzegyzzwlmfavr.supabase.co',KEY='sb_publishable_8BKTlYkIEEwNS-dDauIfFg_3FSdkcDJ',db=supabase.createClient(URL,KEY);async function admin(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='index.html';return false}const {data,error}=await db.from('rise_fc_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){alert('관리자만 이용할 수 있습니다.');location.href='index.html';return false}return true}async function init(){
 if(!await admin()) return;
 const status=document.getElementById('status');
 const matchSelect=document.getElementById('match');
 const playerSelect=document.getElementById('player');
 matchSelect.innerHTML='<option value="">경기를 불러오는 중...</option>';
 playerSelect.innerHTML='<option value="">선수를 불러오는 중...</option>';
 const [m,p]=await Promise.all([
   db.from('matches').select('*'),
   db.from('players').select('*')
 ]);
 if(m.error||p.error){
   status.textContent='목록 조회 실패\n'+(m.error?'경기: '+m.error.message+'\n':'')+(p.error?'선수: '+p.error.message:'');
   matchSelect.innerHTML='<option value="">경기 조회 실패</option>';
   playerSelect.innerHTML='<option value="">선수 조회 실패</option>';
   return;
 }
 const matches=(m.data||[]).sort((a,b)=>String(b.match_date||b.date||'').localeCompare(String(a.match_date||a.date||''))), players=(p.data||[]).sort((a,b)=>Number(a.number??a.jersey_number??999)-Number(b.number??b.jersey_number??999));
 matchSelect.innerHTML='<option value="">경기를 선택하세요</option>'+matches.map(x=>{
   const date=x.match_date||x.date||'날짜 미정';
   const opponent=x.opponent||x.team||x.title||'상대팀';
   return `<option value="${x.id}">${date} · ${opponent}</option>`;
 }).join('');
 playerSelect.innerHTML='<option value="">선수를 선택하세요</option>'+players.map(x=>{
   const name=x.name||x.player_name||x.full_name||'이름 미등록';
   const number=x.number??x.jersey_number??'';
   return `<option value="${x.id}">${number!==''?number+'번 ':''}${name}</option>`;
 }).join('');
 if(!matches.length) matchSelect.innerHTML='<option value="">등록된 경기가 없습니다</option>';
 if(!players.length) playerSelect.innerHTML='<option value="">등록된 선수가 없습니다</option>';
 status.textContent=`경기 ${matches.length}개 · 선수 ${players.length}명 불러왔습니다.`;
}
document.getElementById('save').onclick=async()=>{const status=document.getElementById('status');const match_id=document.getElementById('match').value,player_id=document.getElementById('player').value,stat_type=document.getElementById('type').value,minute=document.getElementById('minute').value;if(!match_id||!player_id){status.textContent='경기와 선수를 선택하세요.';return}const {error}=await db.from('player_match_stats').insert({match_id,player_id,stat_type,minute:minute?Number(minute):null});status.textContent=error?'저장 실패: '+error.message:'기록 저장 완료!';};init();</script></body></html>
