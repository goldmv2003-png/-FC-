
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="검단 라이즈FC 경기 일정 및 결과">
<title>경기일정 | GEOMDAN RISE FC</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* 경기 페이지 */
.match-page-list{
  display:grid;
  gap:15px;
  margin:30px 0;
}

.match-data-card{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:17px 20px;
  margin-bottom:0;
}

.match-data-card h2{
  font-size:18px;
  line-height:1.5;
  margin:10px 0;
}

.match-meta{
  color:#aaa;
  font-size:13px;
  line-height:1.9;
}

.match-badge{
  display:inline-block;
  background:#333;
  color:#c9a646;
  padding:6px 10px;
  border-radius:4px;
  font-size:11px;
}

.match-badge.finished{
  background:#234b32;
  color:#8cdb9e;
}

/* 자세히 보기 버튼 */
.match-detail-toggle{
  width:100%;
  margin-top:14px;
  padding:13px 5px 2px;
  border:none;
  border-top:1px solid #383838;
  background:transparent;
  color:#c9a646;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
}

.match-detail-toggle:hover{
  color:#f1d27a;
}

/* 상세 내용 */
.match-detail-content{
  display:none;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #383838;
}

.match-detail-content.open{
  display:block;
}

.match-detail-heading{
  color:#c9a646;
  font-size:14px;
  font-weight:bold;
  margin-bottom:12px;
}

/* 선발 발표 전 안내 */
.match-upcoming-notice{
  background:#202020;
  border:1px solid #444;
  border-radius:8px;
  padding:20px 15px;
  color:#ddd;
  text-align:center;
  font-size:14px;
  line-height:1.8;
}

.match-upcoming-notice strong{
  color:#c9a646;
  display:block;
  margin-bottom:6px;
}

/* 기존 경기 상세 디자인 */
.formation-box{
  background:#202020;
  border:1px solid #444;
  padding:18px;
  border-radius:8px;
  margin-top:20px;
}

.formation-title{
  color:#c9a646;
  font-weight:bold;
  margin-bottom:15px;
}

.bench-list{
  color:#ccc;
  font-size:13px;
  line-height:2;
  margin-top:20px;
}

.result-score{
  font-size:35px;
  font-weight:900;
  color:#c9a646;
  margin:15px 0;
}

.result-details{
  color:#bbb;
  font-size:14px;
  line-height:1.9;
  white-space:pre-line;
  margin-top:15px;
}

.match-loading{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.match-error{
  color:#ff7777;
  padding:20px;
  line-height:1.8;
}

.match-tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.match-tabs button{
  background:#222;
  color:#fff;
  border:1px solid #444;
  cursor:pointer;
}

.match-tabs button.active{
  background:#c9a646;
  color:#000;
  border-color:#c9a646;
}

/* =================================
   세로형 축구 전술 작전판
================================= */

.pitch-title{
  color:#c9a646;
  text-align:center;
  font-weight:900;
  margin:20px 0 10px;
  letter-spacing:2px;
  font-size:14px;
}

.tactics-pitch{
  position:relative;
  width:100%;
  max-width:490px;
  min-height:560px;
  margin:20px auto;
  padding:35px 8px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:12px;
  overflow:hidden;
  border:3px solid white;
  border-radius:8px;

  background:repeating-linear-gradient(
    0deg,
    #176b3c 0px,
    #176b3c 65px,
    #1d7946 65px,
    #1d7946 130px
  );
}

/* 경기장 중앙선 */
.pitch-half-line{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  border-top:2px solid #ffffff88;
  z-index:1;
}

/* 중앙 원 */
.pitch-center-circle{
  position:absolute;
  width:110px;
  height:110px;
  border:2px solid #ffffff88;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:1;
}

/* 선수 배치 행 */
.pitch-row{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  width:100%;
  min-height:65px;
}

/* 선수 */
.pitch-player{
  display:flex;
  flex:1;
  min-width:0;
  max-width:85px;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.pitch-player-number{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#c9a646;
  color:#111;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:14px;
  box-shadow:0 3px 8px #0008;
}

.pitch-player-name{
  color:white;
  font-size:11px;
  font-weight:bold;
  margin-top:6px;
  text-shadow:0 2px 4px black;
  word-break:keep-all;
}

.pitch-position-label{
  color:#ffe29a;
  font-size:10px;
  margin-top:3px;
}

.pitch-direction{
  color:#ffffffaa;
  font-size:10px;
  text-align:center;
  letter-spacing:3px;
  margin-bottom:5px;
}

/* 작전판 하단 */
.pitch-footer{
  text-align:center;
  color:#aaa;
  font-size:11px;
  margin-top:10px;
}

@media(max-width:600px){

  .match-data-card{
    padding:15px;
  }

  .match-data-card h2{
    font-size:16px;
  }

  .result-score{
    font-size:28px;
  }

  .tactics-pitch{
    min-height:480px;
    padding:20px 4px;
    gap:8px;
  }

  .pitch-player-number{
    width:33px;
    height:33px;
    font-size:12px;
  }

  .pitch-player-name{
    font-size:9px;
  }

  .pitch-position-label{
    font-size:9px;
  }

  .pitch-center-circle{
    width:85px;
    height:85px;
  }

  .match-detail-toggle{
    padding:13px 5px 2px;
  }
}
</style>
</head>

<body>

<!-- 상단 메뉴 -->
<header class="match-page-header">

  <a href="index.html" class="logo">
    <img src="images/라이즈FC 엠블럼.png" alt="라이즈FC 엠블럼">
    RISE<span>FC</span>
  </a>

  <a href="index.html" class="match-back">
    ← 홈으로 돌아가기
  </a>

</header>

<!-- 경기 페이지 -->
<main class="match-page">

  <p class="section-label">03 / MATCH CENTER</p>

  <h1>전체 경기일정<span>.</span></h1>

  <p class="match-page-desc">
    검단 라이즈FC의 경기 일정, 확정 포메이션 및 경기 결과를 확인하세요.
  </p>

  <!-- 경기 필터 -->
  <div class="match-tabs match-page-tabs">

    <button type="button" data-filter="ALL">전체 경기</button>

    <button type="button" class="active" data-filter="UPCOMING">
      예정 경기
    </button>

    <button type="button" data-filter="RESULTS">경기 결과</button>

  </div>

  <!-- 경기 목록 -->
  <div class="match-page-list" id="all-match-list">

    <div class="match-loading">
      경기 정보를 불러오는 중입니다...
    </div>

  </div>

  <a href="index.html#matches" class="match-home-btn">
    ← 경기일정 메인으로
  </a>

</main>

<footer>

  <strong>GEOMDAN RISE FC</strong>

  <p>RISE TOGETHER. · © 2026 RISE FC</p>

</footer>


<script>
/* =================================
   SUPABASE 연결
================================= */

const SUPABASE_URL = "https://gqsecxgzegyzzwlmfavr.supabase.co";

const SUPABASE_KEY = "sb_publishable_8BKTlYkIEEwNS-dDauIfFg_3FSdkcDJ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const list = document.getElementById("all-match-list");

let matches = [];
let players = [];
let currentFilter = "UPCOMING";
let playerLoadError = false;


/* =================================
   HTML 안전 처리
================================= */

function safe(value) {

  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[c]);

}


/* =================================
   한국 날짜
================================= */

function getKoreaToday() {

  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const values = {};

  parts.forEach(part => {
    values[part.type] = part.value;
  });

  return `${values.year}-${values.month}-${values.day}`;

}


/* =================================
   경기 데이터 불러오기
================================= */

async function loadPublicMatches() {

  list.innerHTML = `
    <div class="match-loading">
      경기 정보를 불러오는 중입니다...
    </div>
  `;

  try {

    const { data, error } = await db
      .from("matches")
      .select("*")
      .order("match_date", { ascending: true });

    if (error) throw error;

    matches = data || [];

    console.log("전체 경기 데이터:", matches);
    console.log("불러온 경기 수:", matches.length);

    // 선수 데이터 조회
    const { data: playerData, error: playerError } = await db
      .from("players")
      .select("id,number,name,position");

    if (playerError) {

      console.error("선수 조회 오류:", playerError);

      playerLoadError = true;
      players = [];

    } else {

      players = playerData || [];
      playerLoadError = false;

    }

    renderMatches();

  } catch (error) {

    console.error("경기 로딩 오류:", error);

    list.innerHTML = `
      <div class="match-error">
        경기 정보를 불러오지 못했습니다.<br><br>
        ${safe(error.message)}
        <br><br>
        Supabase matches 테이블의 조회 권한을 확인해 주세요.
      </div>
    `;

  }

}


/* =================================
   선수 정보 찾기
================================= */

function findPlayer(id) {

  return players.find(
    p => String(p.id) === String(id)
  );

}


/* =================================
   포메이션 작전판
================================= */

function renderTacticsBoard(match) {

  const lineup = Array.isArray(match.lineup)
    ? match.lineup
    : [];

  if (!lineup.length) {

    return `
      <p class="match-loading">
        확정된 선발 명단이 없습니다.
      </p>
    `;

  }

  function getNumber(slot) {

    const found = String(slot.slot || "").match(/\d+/);

    return found ? Number(found[0]) : 0;

  }

  let rows = [];

  if (match.formation === "4-2-3-1") {

    rows = [

      lineup.filter(p => p.position === "FW"),

      lineup.filter(
        p => p.position === "MF" && getNumber(p) >= 3
      ),

      lineup.filter(
        p => p.position === "MF" && getNumber(p) <= 2
      ),

      lineup.filter(p => p.position === "DF"),

      lineup.filter(p => p.position === "GK")

    ];

  } else {

    rows = [
      lineup.filter(p => p.position === "FW"),
      lineup.filter(p => p.position === "MF"),
      lineup.filter(p => p.position === "DF"),
      lineup.filter(p => p.position === "GK")
    ];

  }

  rows = rows
    .filter(row => row.length)
    .map(row => row.sort((a, b) => getNumber(a) - getNumber(b)));

  return `
    <div class="pitch-title">
      STARTING XI · ${safe(match.formation || "FORMATION")}
    </div>

    <div class="pitch-direction">
      ▲ ATTACK
    </div>

    <div class="tactics-pitch">

      <div class="pitch-half-line"></div>
      <div class="pitch-center-circle"></div>

      ${rows.map(row => `

        <div class="pitch-row">

          ${row.map(slot => {

            const player = findPlayer(slot.player_id);

            return `
              <div class="pitch-player">

                <div class="pitch-player-number">
                  ${player ? safe(player.number) : "?"}
                </div>

                <div class="pitch-player-name">
                  ${player ? safe(player.name) : "선수 정보 없음"}
                </div>

                <div class="pitch-position-label">
                  ${safe(slot.slot || slot.position)}
                </div>

              </div>
            `;

          }).join("")}

        </div>

      `).join("")}

    </div>

    <div class="pitch-footer">
      GEOMDAN RISE FC · OFFICIAL STARTING XI
    </div>
  `;

}


/* =================================
   경기 카드 출력
================================= */

function renderMatches() {

  const today = getKoreaToday();

  let filtered = [...matches];

  // 예정 경기
  if (currentFilter === "UPCOMING") {

    filtered = filtered.filter(match => {

      const status = String(match.status || "").toLowerCase();
      const matchDate = String(match.match_date || "").slice(0, 10);

      return (
        status !== "finished" &&
        matchDate !== "" &&
        matchDate >= today
      );

    });

    filtered.sort((a, b) =>
      String(a.match_date).localeCompare(String(b.match_date))
    );

  }

  // 경기 결과
  else if (currentFilter === "RESULTS") {

    filtered = filtered.filter(match =>
      String(match.status || "").toLowerCase() === "finished"
    );

    filtered.sort((a, b) =>
      String(b.match_date).localeCompare(String(a.match_date))
    );

  }

  // 전체 경기
  else {

    filtered.sort((a, b) =>
      String(a.match_date).localeCompare(String(b.match_date))
    );

  }

  console.log(
    "현재 탭:",
    currentFilter,
    "표시 경기:",
    filtered.length
  );

  // 경기 없음
  if (!filtered.length) {

    let message = "등록된 경기가 없습니다.";

    if (currentFilter === "UPCOMING") {
      message = "예정된 경기가 없습니다.";
    }

    if (currentFilter === "RESULTS") {
      message = "아직 경기 결과가 없습니다.";
    }

    list.innerHTML = `
      <div class="match-page-empty">

        <span>03</span>

        <h2>${safe(message)}</h2>

        <p>
          경기 일정이 등록되면 이곳에 표시됩니다.
        </p>

      </div>
    `;

    return;

  }

  // 경기 카드 생성
  list.innerHTML = filtered.map((match, index) => {

    const finished =
      String(match.status || "").toLowerCase() === "finished";

    const lineup = Array.isArray(match.lineup)
      ? match.lineup
      : [];

    const attendance = Array.isArray(match.attendance)
      ? match.attendance
      : [];

    const hasLineup = lineup.length > 0;

    const tacticsBoard = renderTacticsBoard(match);

    const starterIds = lineup.map(
      slot => String(slot.player_id)
    );

    const bench = attendance
      .filter(id => !starterIds.includes(String(id)))
      .map(id => findPlayer(id))
      .filter(Boolean);

    const benchHTML = bench.length
      ? bench.map(p =>
          safe(p.number) + "번 " + safe(p.name)
        ).join(" / ")
      : "등록된 후보 선수가 없습니다.";

    const scorerHTML = Array.isArray(match.scorers)
      ? match.scorers.map(s => safe(s)).join("<br>")
      : safe(match.scorers || "");

    const cardId = `match-detail-${index}`;

    return `

      <article class="match-data-card">

        <div>

          <span class="match-badge ${finished ? "finished" : ""}">
            ${finished ? "경기 종료" : "경기 예정"}
          </span>

        </div>

        <h2>
          GEOMDAN RISE FC vs ${safe(match.opponent || "상대팀 미정")}
        </h2>

        <div class="match-meta">

          📅 ${safe(match.match_date)}
          ${safe(match.match_time || "")}

          <br>

          📍 ${safe(match.venue || "장소 미정")}

        </div>

        <button
          type="button"
          class="match-detail-toggle"
          aria-expanded="false"
          aria-controls="${cardId}"
          onclick="toggleMatchDetail(this)"
        >
          ▼ 자세히 보기
        </button>

        <div
          class="match-detail-content"
          id="${cardId}"
        >

          ${finished ? `

            <div class="match-detail-heading">
              ⚽ MATCH RESULT · 경기 결과
            </div>

            <div class="result-score">
              ${safe(match.home_score ?? 0)}
              :
              ${safe(match.away_score ?? 0)}
            </div>

            <div class="result-details">

              <strong>득점 기록</strong>

              <br>

              ${scorerHTML || "득점 기록 없음"}

              <br><br>

              <strong>경기 기록</strong>

              <br>

              ${safe(
                match.match_notes ||
                "등록된 경기 기록이 없습니다."
              )}

            </div>

          ` : ""}

          ${hasLineup ? `

            <div class="formation-box">

              <div class="formation-title">
                ⚽ CONFIRMED FORMATION ·
                ${safe(match.formation || "미정")}
              </div>

              <strong>STARTING LINEUP · 선발 명단</strong>

              ${tacticsBoard}

              <div class="bench-list">

                <strong>
                  SUBSTITUTES · 후보 선수 (${bench.length}명)
                </strong>

                <br>

                ${benchHTML}

              </div>

            </div>

          ` : `

            <div class="match-upcoming-notice">

              <strong>
                ${finished
                  ? "선발 명단 정보가 없습니다."
                  : "아직 선발라인 발표 전이에요."
                }
              </strong>

              ${finished
                ? "등록된 포메이션과 선발 선수 정보가 없습니다."
                : "선발라인이 공개되면 포메이션과 선수별 포지션을 확인할 수 있습니다."
              }

            </div>

          `}

          ${playerLoadError && hasLineup ? `

            <p class="match-error">
              선수 정보를 불러오지 못해 작전판의 선수 이름이 표시되지 않을 수 있습니다.
            </p>

          ` : ""}

        </div>

      </article>

    `;

  }).join("");

}


/* =================================
   경기 상세 보기 열기 / 닫기
================================= */

function toggleMatchDetail(button) {

  const detailId = button.getAttribute("aria-controls");

  const detail = document.getElementById(detailId);

  if (!detail) return;

  const isOpen = detail.classList.toggle("open");

  button.setAttribute("aria-expanded", String(isOpen));

  button.textContent = isOpen
    ? "▲ 자세히 접기"
    : "▼ 자세히 보기";

}


/* =================================
   경기 탭 클릭 기능
================================= */

const matchTabButtons = document.querySelectorAll(
  ".match-page-tabs [data-filter]"
);

matchTabButtons.forEach(button => {

  button.type = "button";

  button.addEventListener("click", function(event) {

    event.preventDefault();

    currentFilter = this.dataset.filter;

    matchTabButtons.forEach(btn => {
      btn.classList.remove("active");
    });

    this.classList.add("active");

    renderMatches();

  });

});


/* =================================
   실시간 경기 업데이트
================================= */

db.channel("public-match-updates")

  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "matches"
    },
    () => {

      console.log("경기 데이터 변경 감지");

      loadPublicMatches();

    }
  )

  .subscribe(status => {

    console.log(
      "경기 실시간 연결 상태:",
      status
    );

  });


/* =================================
   최초 실행
================================= */

currentFilter = "UPCOMING";

matchTabButtons.forEach(button => {

  button.classList.toggle(
    "active",
    button.dataset.filter === "UPCOMING"
  );

});

loadPublicMatches();

</script>

</body>
</html>
